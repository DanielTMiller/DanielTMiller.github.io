<style>
  :root {
    --bg: #E8EDF2;
    --sheet: #F5F8FA;
    --ink: #17293D;
    --ink-soft: #4E6577;
    --ink-faint: #7C93A5;
    --line: rgba(23, 41, 61, 0.16);
    --grid-line: rgba(23, 41, 61, 0.065);
    --accent: #D9531A;
    --accent-strong: #B8410F;
    --accent-ink: #FFF7F1;
    --photo-mat: #FFFFFF;
    --plate: #1B3049;
    --plate-ink: #F2F6F9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: clamp(14px, 3vw, 32px);
  }

  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .sheet {
    position: relative;
    max-width: 1080px;
    margin: 0 auto;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      var(--sheet);
    background-size: 28px 28px, 28px 28px, auto;
    border: 1px solid var(--line);
    padding: clamp(20px, 4vw, 44px) clamp(18px, 5vw, 56px) clamp(28px, 5vw, 52px);
  }

  .crop { position: absolute; width: 18px; height: 18px; pointer-events: none; }
  .crop::before, .crop::after { content: ""; position: absolute; background: var(--ink-faint); }
  .crop::before { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); }
  .crop::after { left: 50%; top: 0; height: 100%; width: 1px; transform: translateX(-50%); }
  .crop.tl { top: -9px; left: -9px; }
  .crop.tr { top: -9px; right: -9px; }
  .crop.bl { bottom: -9px; left: -9px; }
  .crop.br { bottom: -9px; right: -9px; }

  header.hero { margin-top: clamp(18px, 4vw, 34px); margin-bottom: clamp(36px, 7vw, 64px); }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: "";
    width: 26px;
    height: 1px;
    background: var(--ink-faint);
    display: inline-block;
  }

  h1 {
    font-family: "Big Shoulders Display", "Arial Narrow", sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    font-size: clamp(2.6rem, 8vw, 5.4rem);
    line-height: 0.92;
    letter-spacing: 0.005em;
    margin: 0 0 20px;
    text-wrap: balance;
    color: var(--ink);
  }

  .subtitle {
    font-size: clamp(1rem, 1.6vw, 1.15rem);
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 56ch;
    margin: 0;
  }

  /* ---- Equation ---- */
  .equation {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(14px, 3vw, 28px);
    margin-bottom: clamp(40px, 7vw, 68px);
  }

  .part {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: clamp(150px, 22vw, 218px);
    margin: 0;
    animation: rise 0.6s cubic-bezier(.2,.8,.3,1) both;
  }
  .part:nth-of-type(1) { animation-delay: 0.05s; }
  .part:nth-of-type(2) { animation-delay: 0.25s; }
  .part:nth-of-type(3) { animation-delay: 0.45s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .part { animation: none; }
  }

  .photo-frame {
    width: 100%;
    aspect-ratio: 4 / 5;
    background: var(--photo-mat);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    position: relative;
  }
  .photo-frame img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  .part figcaption {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.66rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .part-name {
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.3;
  }

  .operator {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    color: var(--ink);
    align-self: center;
    position: relative;
    width: clamp(46px, 6vw, 64px);
    height: clamp(46px, 6vw, 64px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    animation: rise 0.6s cubic-bezier(.2,.8,.3,1) both;
  }
  .operator.plus { animation-delay: 0.16s; }
  .operator.equals { animation-delay: 0.36s; }
  @media (prefers-reduced-motion: reduce) { .operator { animation: none; } }

  .operator::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px dashed var(--line);
    border-radius: 50%;
  }

  .result .nameplate {
    width: 100%;
    aspect-ratio: 4 / 5;
    background: var(--plate);
    color: var(--plate-ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    padding: 14px;
    position: relative;
    border-bottom: 3px solid var(--accent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  
  .nameplate-name {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: clamp(1.3rem, 2.9vw, 1.7rem);
    line-height: 1.08;
    text-transform: uppercase;
  }

  /* ---- Title block ---- */
  .title-block {
    border-top: 2px solid var(--ink);
    padding-top: clamp(18px, 3vw, 26px);
  }

  .tb-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0;
    border: 1px solid var(--line);
    margin-bottom: 18px;
  }

  .tb-field {
    padding: 12px 16px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tb-field:last-child { border-right: none; }

  .tb-label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .tb-value {
    font-size: 0.98rem;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
  }

  .tb-link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .tb-link:hover { color: var(--ink-soft); }

  .tb-note {
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 62ch;
    margin: 0;
  }
  .tb-note a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .tb-note a:hover { color: var(--ink-soft); }

  @media (max-width: 620px) {
    .equation { flex-direction: column; }
    .part { width: min(240px, 70vw); }
    .operator { width: auto; height: auto; padding: 6px 0; }
    .operator::before { inset: -8px; }
  }
</style>
